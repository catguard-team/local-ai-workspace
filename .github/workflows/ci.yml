name: Tests and source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -c requirements-lock.txt
      - name: Prepare empty test directories
        run: New-Item -ItemType Directory -Path agent,.runtime -Force | Out-Null
      - name: Windows API, queue, filesystem and account tests
        run: python -m unittest discover -p "test_*.py" -v
      - name: Browser logic
        run: node test_queue_ui.cjs
      - name: Release manifest
        run: python scripts/check_release.py
      - name: PowerShell syntax
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) { throw "PowerShell syntax error in $($_.Name)" }
          }
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux relay unit tests (no root or network changes)
        working-directory: deploy/aws-relay
        run: python -m unittest -v test_relay

